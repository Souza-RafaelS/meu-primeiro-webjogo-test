<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-select=no">
    <link rel="manifest" href="manifest.json">
    <title>Meu RPG Nativo</title>
    <style>
        body { margin: 0; background: #111; display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; font-family: sans-serif; overflow: hidden; overscroll-behavior-y: contain; }
        canvas { background: #2e8b57; border: 4px solid #333; box-shadow: 0 0 20px rgba(0,0,0,0.5); image-rendering: pixelated; max-width: 95vw; max-height: 55vh; }
        
        .controles-touch {
            display: none;
            margin-top: 20px;
            grid-template-columns: repeat(3, 65px);
            grid-template-rows: repeat(3, 65px);
            gap: 10px;
        }
        
        .btn-touch {
            background: rgba(255, 255, 255, 0.15);
            border: 2px solid rgba(255, 255, 255, 0.6);
            border-radius: 50%;
            color: white;
            font-size: 24px;
            display: flex;
            justify-content: center;
            align-items: center;
            user-select: none;
            touch-action: none;
            -webkit-tap-highlight-color: transparent;
        }
        
        .btn-touch:active { background: rgba(255, 255, 255, 0.4); border-color: #fff; }

        @media (max-width: 768px) {
            .controles-touch { display: grid; }
        }
    </style>
</head>
<body>

    <canvas id="rpg" width="400" height="400"></canvas>

    <div class="controles-touch">
        <div></div> <div class="btn-touch" id="btn-cima">▲</div> <div></div>
        <div class="btn-touch" id="btn-esquerda">◀</div> <div></div> <div class="btn-touch" id="btn-direita">▶</div>
        <div></div> <div class="btn-touch" id="btn-baixo">▼</div> <div></div>
    </div>

    <script src="mapa.js"></script>
    <script src="teclado.js"></script>
    <script src="motor.js"></script>

    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js');
        }
    </script>
</body>
</html>
